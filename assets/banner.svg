<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#1a1b2e" />
      <stop offset="100%" stop-color="#2d1b69" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0" />
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="1" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&amp;family=Fira+Code:wght@400;600;700&amp;display=swap');
    .fa { font-family: 'Vazirmatn', 'Tahoma', 'Arial', sans-serif; }
    .en { font-family: 'Fira Code', 'Consolas', monospace; }
  </style>

  <rect width="1280" height="340" fill="url(#bgGrad)" />

  <circle cx="80" cy="80" r="200" fill="#8A2BE2" opacity="0.08" />
  <circle cx="1200" cy="280" r="220" fill="#6A5ACD" opacity="0.1" />
  <circle cx="1150" cy="60" r="80" fill="#a78bfa" opacity="0.08" />

  <text x="640" y="125" text-anchor="middle" class="fa" font-size="76" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)">سجاد غضنفری</text>

  <text x="640" y="185" text-anchor="middle" class="en" font-size="26" font-weight="700" fill="#a78bfa" letter-spacing="6">SAJJAD GHAZANFARI</text>

  <line x1="400" y1="215" x2="880" y2="215" stroke="url(#accentGrad)" stroke-width="2" />

  <text x="640" y="255" text-anchor="middle" class="en" font-size="17" fill="#c4b5fd" letter-spacing="1">Full-Stack Developer  •  AI Researcher  •  Academic &amp; Industry</text>

  <text x="640" y="305" text-anchor="middle" class="en" font-size="15" font-weight="600" fill="#8A2BE2" letter-spacing="3">🌐 sghazanfari.ir</text>
</svg>
